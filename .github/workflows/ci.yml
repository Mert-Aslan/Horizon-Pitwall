name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: python -m pip install -r requirements-build.txt pytest==9.1.1 httpx==0.28.1

      - name: UI typecheck, tests and build
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Backend tests
        env:
          PITWALL_NO_DIALOGS: "1"
        run: python -m pytest -q

      - name: Build the Windows package
        run: python tools/build_exe.py

      - name: Test the packaged app
        run: python tools/test_exe.py --no-tray

      - name: Test Windows Service mode (disposable runner only)
        run: python tools/test_service_exe.py --allow-system-changes

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: HorizonPitwall-ci-${{ github.sha }}
          path: dist-release/
          retention-days: 14
          if-no-files-found: warn
