name: Release

# A pushed version tag (vX.Y.Z) builds, tests and creates a DRAFT release with the ZIP.
# Manual runs default to build-only (artifact, no release). A maintainer reviews the
# draft and publishes it by hand; this workflow never publishes and never creates tags.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      mode:
        description: "build-only: artifact only. draft: also create a draft release for an existing tag."
        type: choice
        options: [build-only, draft]
        default: build-only
      tag:
        description: "Existing tag for draft mode (vX.Y.Z)"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 45
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'draft' && inputs.tag || github.ref }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install Python dependencies
        run: python -m pip install -r requirements-build.txt pytest==9.1.1 httpx==0.28.1

      - name: Backend tests
        env:
          PITWALL_NO_DIALOGS: "1"
        run: python -m pytest -q

      - name: Build (UI from lockfile, version must match the tag)
        id: build
        shell: pwsh
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          MODE: ${{ inputs.mode }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          $tag = if ($env:EVENT -eq 'push') { $env:REF_NAME } elseif ($env:MODE -eq 'draft') { $env:INPUT_TAG } else { '' }
          if ($env:MODE -eq 'draft' -and -not ($tag -match '^v\d+\.\d+\.\d+$')) { throw "draft mode needs an existing tag like v1.2.3" }
          if ($tag) { python tools/build_exe.py --build-ui --tag $tag } else { python tools/build_exe.py --build-ui }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test the packaged app
        run: python tools/test_exe.py --no-tray

      - name: Test Windows Service mode (disposable runner only)
        run: python tools/test_service_exe.py --allow-system-changes

      - name: Release notes
        run: python tools/release_notes.py dist-release dist-release/RELEASE_NOTES.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: HorizonPitwall-release
          path: |
            dist-release/*.zip
            dist-release/SHA256SUMS.txt
            dist-release/*-release-manifest.json
            dist-release/RELEASE_NOTES.md
            dist-release/*-report.json
          retention-days: 30
          if-no-files-found: error

  draft-release:
    needs: build
    if: github.event_name == 'push' || inputs.mode == 'draft'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: HorizonPitwall-release
          path: out

      - name: Verify checksums
        working-directory: out
        run: sha256sum --check SHA256SUMS.txt

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          [ "$TAG" = "v$VERSION" ] || { echo "tag $TAG does not match version $VERSION"; exit 1; }
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "a release for $TAG already exists; not changing it"; exit 1
          fi
          gh release create "$TAG" --draft --verify-tag \
            --title "Horizon Pitwall $VERSION" \
            --notes-file out/RELEASE_NOTES.md \
            "out/HorizonPitwall-$VERSION-windows-x64.zip" \
            out/SHA256SUMS.txt \
            "out/HorizonPitwall-$VERSION-release-manifest.json"
